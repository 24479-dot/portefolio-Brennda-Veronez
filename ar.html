
<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Experiência AR | Portefólio</title>

    <link rel="stylesheet" href="ar.css">

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script src="ar.js"></script>

</head>

<body>

    <div id="interface-ar">

        <a href="index.html" class="voltar">
            ← Voltar ao portefólio
        </a>

        <div class="instrucoes">

            <h1>Experiência AR</h1>

            <p id="estado">
                A carregar a experiência...
            </p>

        </div>

        <div class="moldura-ar"></div>

    </div>

    <a-scene
        mindar-image="
            imageTargetSrc: ./targets%20(1).mind;
            autoStart: false;
            uiLoading: no;
            uiScanning: no;
            uiError: no;
        "
        color-space="sRGB"
        renderer="colorManagement: true; alpha: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
    >

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <a-entity
            id="marcador"
            mindar-image-target="targetIndex: 0">

            <a-plane
                id="animacao-envelope"
                width="11.10"
                height="12.613636"
                position="0 4.85 0.001"
                rotation="0 0 0"
                material="
                    shader: flat;
                    transparent: true;
                    side: double;
                    depthWrite: false;
                "
                visible="false"
                sequencia-envelope>

            </a-plane>

        </a-entity>

    </a-scene>

</body>

</html>
