
<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teste de Câmara</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: black;
            font-family: Arial, sans-serif;
        }

        video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: none;
        }

        .controlos {
            position: fixed;
            bottom: 20px;
            left: 5%;
            width: 90%;
            padding: 15px;
            background: rgba(0,0,0,0.8);
            border-radius: 10px;
            color: white;
        }

        button, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            font-size: 15px;
        }

        #estado {
            font-size: 13px;
        }

    </style>

</head>

<body>

    <video id="camera" autoplay playsinline muted></video>

    <div class="controlos">

        <select id="listaCamaras"></select>

        <button id="trocar">
            Selecionar câmara
        </button>

        <button id="focar">
            Ajustar foco
        </button>

        <p id="estado">A iniciar a câmara...</p>

    </div>

    <script>

        const video = document.getElementById("camera");

        const lista = document.getElementById("listaCamaras");

        const estado = document.getElementById("estado");

        let stream;


        async function iniciarCamera(deviceId = null) {

            if (stream) {

                stream.getTracks().forEach(
                    track => track.stop()
                );

            }

            try {

                const configuracao = deviceId
                    ? { deviceId: { exact: deviceId } }
                    : { facingMode: { ideal: "environment" } };

                stream = await navigator.mediaDevices.getUserMedia({

                    audio: false,

                    video: configuracao

                });

                video.srcObject = stream;

                await video.play();

                await listarCamaras();

                mostrarConfiguracao();

            } catch (erro) {

                estado.textContent = erro.message;

            }

        }


        async function listarCamaras() {

            const dispositivos =
                await navigator.mediaDevices.enumerateDevices();

            const cameras = dispositivos.filter(
                dispositivo => dispositivo.kind === "videoinput"
            );

            lista.innerHTML = "";

            cameras.forEach((camera, index) => {

                const opcao = document.createElement("option");

                opcao.value = camera.deviceId;

                opcao.textContent =
                    camera.label || `Câmara ${index + 1}`;

                lista.appendChild(opcao);

            });

            lista.value =
                stream.getVideoTracks()[0]
                    .getSettings().deviceId;

        }


        function mostrarConfiguracao() {

            const track = stream.getVideoTracks()[0];

            const dados = track.getSettings();

            estado.textContent =
                `${track.label} | ` +
                `${dados.width} × ${dados.height}`;

        }


        async function ajustarFoco() {

            if (!stream) return;

            const track = stream.getVideoTracks()[0];

            const capacidades =
                track.getCapabilities?.() || {};

            try {

                if (capacidades.focusMode?.includes("continuous")) {

                    await track.applyConstraints({

                        ...track.getConstraints(),

                        advanced: [
                            { focusMode: "continuous" }
                        ]

                    });

                    estado.textContent =
                        "Focagem solicitada: " +
                        (track.getSettings().focusMode || "não confirmada");

                } else {

                    estado.textContent =
                        "Esta câmara não disponibiliza controlo de foco ao navegador.";

                }

            } catch (erro) {

                estado.textContent = erro.message;

            }

        }


        document.getElementById("trocar").onclick = () => {

            iniciarCamera(lista.value);

        };


        document.getElementById("focar").onclick = ajustarFoco;


        iniciarCamera();

    </script>

</body>

</html>
